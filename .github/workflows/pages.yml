name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - public/**
      - .github/workflows/pages.yml
    branches-ignore:
      - NEVER_RUN_THIS_DIRECTLY_USE_SYNC_YML_INSTEAD

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
