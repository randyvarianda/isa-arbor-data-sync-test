name: Sync Member Data & Deploy

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/**"
      - "*.py"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  MIN_DATA_ROWS: 100

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch members + contact details from easyVerein
        env:
          EASYVEREIN_API_TOKEN: ${{ secrets.EASYVEREIN_API_TOKEN }}
        run: |
          if [ -z "$EASYVEREIN_API_TOKEN" ]; then
            echo "::warning::EASYVEREIN_API_TOKEN secret is empty — skipping live fetch, using existing members_full.json"
          else
            python fetch_members.py
          fi

      - name: Enrich data (geocode, images, website, types) → public/data.json
        env:
          EASYVEREIN_API_TOKEN: ${{ secrets.EASYVEREIN_API_TOKEN }}
        run: |
          python enrich_data.py

      - name: Validate output (safety gate — abort on empty/bad data)
        env:
          MIN_DATA_ROWS: ${{ env.MIN_DATA_ROWS }}
        run: |
          python validate_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: sync-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
